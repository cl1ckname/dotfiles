unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# pane navigation (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# splits (no prefix)
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# windows (no prefix)
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-w kill-pane

# vi copy mode
setw -g mode-keys vi
bind -n M-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# floating scratch terminal (no prefix)
bind -n M-f if -F '#{==:#{session_name},scratch}' 'detach' 'display-popup -E -w 90% -h 80% -b rounded -d "#{pane_current_path}" "tmux new-session -A -s scratch"'

# reload config (no prefix)
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# status bar
set -g status-position bottom
set -g status-style "bg=default"
set -g status-left "#[bold]  #S  "
set -g status-left-length 20
set -g status-right "%H:%M"
set -g window-status-current-format "#[bold,underscore] #I #W "
set -g window-status-format " #I #W "
