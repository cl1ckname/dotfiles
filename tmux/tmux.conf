unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},fish},#{pane_title},#{pane_current_command}}"

set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# pane navigation (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize (prefix, repeatable: M-Space h h h ...)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# splits (no prefix)
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# windows (no prefix)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-w kill-pane
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# sessions = projects (no prefix); scratch-* sessions are hidden
bind -n M-s if -F "#{m:scratch-*,#S}" "" {
    choose-tree -Zs -f "#{?#{m:scratch-*,#{session_name}},0,1}"
}
bind -n M-c if -F "#{m:scratch-*,#S}" "" {
    command-prompt -p "new session:" { new-session -A -s "%%" -c "#{pane_current_path}" }
}
bind -n M-. run-shell "~/dotfiles/scripts/tmux-sessions.sh next"
bind -n M-, run-shell "~/dotfiles/scripts/tmux-sessions.sh prev"
bind -n M-e command-prompt -I "#S" -p "rename session:" { rename-session "%%" }
bind -n M-x confirm-before -p "kill session #S? (y/n)" {
    run-shell "~/dotfiles/scripts/tmux-sessions.sh kill"
}

# vi copy mode
setw -g mode-keys vi
bind -n M-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# floating scratch terminal (no prefix) — disabled while getting used to sessions
# bind -n M-f run-shell "~/dotfiles/scripts/tmux-popup.sh"

# reload config (no prefix)
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# status bar
set -g status-position bottom
set -g status-style "bg=default"
set -g status-left " "
set -g status-left-length 20
set -g status-right "#{?#{==:#{client_key_table},off},#[reverse bold] OFF #[default] ,}#{S:#{?#{m:scratch-*,#{session_name}},,#{?#{==:#{session_name},#{client_session}},#[reverse bold] #{session_name} #[default], #{session_name} }}} │ %H:%M "
set -g status-right-length 120
set -g window-status-current-format "#[bold,underscore] #I #W "
set -g window-status-format " #I #W "

# remote host: status on top with hostname, so nested bars don't blend
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g status-position top
    set -g status-left "#[bold]  #h  "
}

# F12: pass all keys to nested (remote) tmux, F12 again to return
bind -T root F12 {
    set prefix None
    set key-table off
    set status-style "fg=colour240,bg=default"
    set window-status-current-format " #I #W "
    if -F "#{pane_in_mode}" { send-keys -X cancel }
    refresh-client -S
}
bind -T off F12 {
    set -u prefix
    set -u key-table
    set -u status-style
    set -u window-status-current-format
    refresh-client -S
}
